<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AverageChemical</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxo-base00: #161616;
            --oxo-base01: #262626;
            --oxo-base02: #393939;
            --oxo-base03: #525252;
            --oxo-base04: #dde1e6;
            --oxo-base05: #f2f4f8;
            --oxo-base06: #ffffff;
            --oxo-red: #ff7eb6;
            --oxo-orange: #ff6f00;
            --oxo-yellow: #ffd60a;
            --oxo-green: #42be65;
            --oxo-cyan: #82cfff;
            --oxo-blue: #78a9ff;
            --oxo-purple: #be95ff;
            --accent-pink: #ee5396;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Share Tech Mono', 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace;
            background: var(--oxo-base00);
            color: var(--oxo-base05);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(82, 82, 82, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(82, 82, 82, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .container {
            text-align: center;
            width: 50%;
            max-width: 1200px;
            margin: 2rem auto 0;
            padding: 3rem;
            background: var(--oxo-base01);
            border: 2px solid var(--oxo-base03);
            position: relative;
            z-index: 1;
        }
        .music-container {
            text-align: left;
            width: 70%;
            max-width: 1200px;
            margin: 2rem auto 0;
            padding: 3rem;
            background: var(--oxo-base01);
            border: 2px solid var(--oxo-base03);
            position: relative;
            z-index: 1;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--oxo-cyan);
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--oxo-cyan);
        }
        .main-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--oxo-base04);
            line-height: 1.6;
        }
        .accent {
            color: var(--accent-pink);
            font-weight: 700;
        }
        .music-platform {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--oxo-base02);
            border: 1px solid var(--oxo-base03);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .music-platform:hover {
            border-color: var(--accent-pink);
            transform: translateY(-2px);
        }
        .music-icon {
            width: 48px;
            height: 48px;
            margin-right: 1.5rem;
            fill: var(--oxo-base05);
            transition: fill 0.3s ease;
            flex-shrink: 0;
        }
        .music-platform:hover .music-icon {
            fill: var(--accent-pink);
        }
        .music-info {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .music-info h3 {
            font-size: 1.4rem;
            color: var(--oxo-base05);
            margin: 0;
            text-align: center;
        }
        .music-info p {
            color: var(--oxo-base04);
            font-size: 1rem;
            line-height: 1.4;
        }
        .music-link {
            color: var(--oxo-base05);
            text-decoration: none;
            display: block;
            width: 100%;
        }
        .music-link:hover h3 {
            color: var(--accent-pink);
        }

        /* --- Styles for Main Buttons Container --- */
        .main-buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin: 2rem auto;
            max-width: 600px;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }
        
        /* --- Styles for Floating Icon Links --- */
        .social-link {
            position: fixed;
            right: 2rem;
            background: var(--oxo-base02);
            color: var(--oxo-base05);
            padding: 1rem;
            border: 2px solid var(--oxo-base03);
            text-decoration: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-link:hover {
            background: var(--oxo-base03);
            border-color: var(--accent-pink);
            color: var(--accent-pink);
            transform: translateY(-2px);
        }

        .social-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        
        .github-link {
            bottom: 2rem;
        }

        .x-link {
            bottom: 6.5rem;
        }
        
        .youtube-link {
            bottom: 11rem;
        }
        
        .soundcloud-link {
            bottom: 15.5rem;
        }
        /* --- End of Floating Icon Styles --- */

        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: var(--oxo-base01);
            border-right: 2px solid var(--oxo-base03);
            transition: left 0.3s ease;
            z-index: 100;
            padding: 2rem 1rem;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar h3 {
            color: var(--oxo-cyan);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        .sidebar ul {
            list-style: none;
            margin-bottom: 2rem;
        }
        .sidebar li {
            margin-bottom: 0.5rem;
        }
        .sidebar a {
            color: var(--oxo-base05);
            text-decoration: none;
            display: block;
            padding: 0.5rem;
            transition: all 0.3s ease;
        }
        .sidebar a:hover {
            color: var(--accent-pink);
            background: var(--oxo-base02);
        }
        .menu-toggle {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: var(--oxo-base02);
            color: var(--oxo-base05);
            border: 2px solid var(--oxo-base03);
            padding: 0.2rem;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 101;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .menu-toggle:hover {
            background: var(--oxo-base03);
            color: var(--accent-pink);
        }
        .menu-toggle.hidden {
            left: -100px;
        }
        .overlay { position: fixed; top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(22, 22, 22, 0.8);
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            .main-text {
                font-size: 1.1rem;
            }
            
            .container, .music-container {
                margin: 1rem;
                padding: 1.5rem;
                width: calc(100% - 2rem);
            }
            
            .main-buttons-container {
                gap: 1rem;
                padding: 0 1rem;
            }
            
            .music-platform {
                padding: 1rem;
                max-width: none;
            }
            
            .music-icon {
                width: 40px;
                height: 40px;
                margin-right: 1rem;
            }
            
            .music-info h3 {
                font-size: 1.2rem;
            }
            
            .social-link {
                right: 1rem;
                padding: 0.8rem;
                font-size: 0.8rem;
            }
            
            .github-link {
                bottom: 1rem;
            }
            .x-link {
                bottom: 5rem;
            }
            .youtube-link {
                bottom: 9rem;
            }
            .soundcloud-link {
                bottom: 13rem;
            }
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
            
            h2 {
                font-size: 1.2rem;
            }
            
            .main-text {
                font-size: 1rem;
            }
            
            .main-buttons-container {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                padding: 0 1rem;
            }
            
            .music-platform {
                flex-direction: column;
                text-align: center;
                padding: 2rem 1rem;
            }
            
            .music-icon {
                margin-right: 0;
                margin-bottom: 1rem;
            }
            
            .music-info h3 {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    
    <button class="menu-toggle" id="menuToggle"><</button>
    
    <div class="sidebar" id="sidebar">
        <h3><span class="accent">Menu</span></h3>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="music.html">Music</a></li>
        </ul>
        
        <h3><span class="accent">Guides</span></h3>
        <ul>
            <li><a href="guides/ricing-guide.html">Ricing Guide</a></li>
        </ul>
    </div>
    
    <h1 style="text-align: center; color: var(--oxo-cyan); font-size: 2.5rem; font-weight: 700; margin: 2rem 0; position: relative; z-index: 1;"><span class="accent">Music</span></h1>
    
    <div class="main-buttons-container">
        <a href="https://soundcloud.com/average-chemical" class="music-link" target="_blank">
            <div class="music-platform">
                <svg class="music-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.999 14.165c-.052 1.796-1.612 3.169-3.4 3.169h-8.18a.68.68 0 0 1-.675-.683V7.862a.747.747 0 0 1 .452-.724s.75-.513 2.333-.513a5.364 5.364 0 0 1 2.763.755 5.433 5.433 0 0 1 2.57 3.54c.282-.08.574-.121.868-.12.884 0 1.73.358 2.347.992s.948 1.49.922 2.373ZM10.721 8.421c.247 2.98.427 5.697 0 8.672a.264.264 0 0 1-.53 0c-.395-2.946-.22-5.718 0-8.672a.264.264 0 0 1 .53 0ZM9.072 9.448c.285 2.659.37 4.986-.006 7.655a.277.277 0 0 1-.55 0c-.331-2.63-.256-5.02 0-7.655a.277.277 0 0 1 .556 0Zm-1.663-.257c.27 2.726.39 5.171 0 7.904a.266.266 0 0 1-.532 0c-.38-2.69-.257-5.21 0-7.904a.266.266 0 0 1 .532 0Zm-1.647.77a26.108 26.108 0 0 1-.008 7.147.272.272 0 0 1-.542 0 27.955 27.955 0 0 1 0-7.147.275.275 0 0 1 .55 0Zm-1.67 1.769c.421 1.865.228 3.5-.029 5.388a.257.257 0 0 1-.514 0c-.21-1.858-.398-3.549 0-5.389a.272.272 0 0 1 .543 0Zm-1.655-.273c.388 1.897.26 3.508-.01 5.412-.026.28-.514.283-.54 0-.244-1.878-.347-3.54-.01-5.412a.283.283 0 0 1 .56 0Zm-1.668.911c.4 1.268.257 2.292-.026 3.572a.257.257 0 0 1-.514 0c-.241-1.262-.354-2.312-.023-3.572a.283.283 0 0 1 .563 0Z"/>
                </svg>
                <div class="music-info">
                    <h3>SoundCloud</h3>
                </div>
            </div>
        </a>

        <a href="https://www.youtube.com/@averagechemical" class="music-link" target="_blank">
            <div class="music-platform">
                <svg class="music-icon" viewBox="0 0 24 24">
                    <path d="M21.582,6.186 C21.325,5.242 20.61,4.545 19.642,4.31 C18.02,3.888 12,3.888 12,3.888 C12,3.888 5.98,3.888 4.358,4.31 C3.39,4.545 2.675,5.242 2.418,6.186 C1.984,7.774 1.984,12 1.984,12 C1.984,12 1.984,16.226 2.418,17.814 C2.675,18.758 3.39,19.455 4.358,19.69 C5.98,20.112 12,20.112 12,20.112 C12,20.112 18.02,20.112 19.642,19.69 C20.61,19.455 21.325,18.758 21.582,17.814 C22.016,16.226 22.016,12 22.016,12 C22.016,12 22.016,7.774 21.582,6.186 Z M9.733,15.208 L9.733,8.792 L15.82,12 L9.733,15.208 Z"/>
                </svg>
                <div class="music-info">
                    <h3>YouTube</h3>
                </div>
            </div>
        </a>

        <a href="https://x.com/averageChemical" class="music-link" target="_blank">
            <div class="music-platform">
                <svg class="music-icon" viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
                <div class="music-info">
                    <h3>X (Twitter)</h3>
                </div>
            </div>
        </a>
    </div>
    
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
            menuToggle.classList.toggle('hidden');
        });
        
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
            menuToggle.classList.remove('hidden');
        });
    </script>
</body>
</html>
